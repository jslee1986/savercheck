name: 수집·사이트 갱신

on:
  schedule:
    - cron: "10 * * * *"       # 매시 10분: 쿠팡 가격 확인 (06:10 첫 확인, 07:40 골드박스 반영은 08:10 회차)
    - cron: "40 22 * * *"      # 한국 07:40: 골드박스 갱신 직후 추가 확인
  push:
    branches: [main]
    paths: ["data/compare.json"]   # Claude가 다른 몰 비교 결과를 올리면 바로 사이트 갱신
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 쿠팡 가격 확인
        if: github.event_name != 'push'
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python collect_coupang.py || echo "쿠팡 확인 실패 — 마지막 확인 시각으로 표시됩니다"

      - name: 사이트 생성
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python build_site.py

      - name: 기록 저장
        run: |
          git config user.name "savercheck-bot"
          git config user.email "savercheck-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "가격 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          git pull --rebase -q && git push -q

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
